[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-kits-inertia"
version = "0.1.1"
description = "Inertia.js adapter for forge-kits / FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["inertia", "fastapi", "forge-kits", "vue", "react", "spa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "forge-kits>=1.5.1",
    "fastapi>=0.138",
]

[project.urls]
Homepage = "https://github.com/forge-kits/inertia"
Repository = "https://github.com/forge-kits/inertia"
Issues = "https://github.com/forge-kits/inertia/issues"

[tool.hatch.build.targets.wheel]
packages = ["forgeapi"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
